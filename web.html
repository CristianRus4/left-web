<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Match browser/UI tint to page theme in light/dark -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FDFDFC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131415" />
    <title>Left</title>
    <meta name="description" content="Visualize your time left — year, month, week, day, and life views you can share as images.">
    <meta property="og:title" content="Left — Visualize Your Time Left">
    <meta property="og:description" content="Year, month, week, day, and life views you can share as images.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://left-time.app/web.html">
    <meta property="og:image" content="https://left-time.app/left-icon/android-chrome-512x512.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Left — Visualize Your Time Left">
    <meta name="twitter:description" content="Year, month, week, day, and life views you can share as images.">
    <meta name="twitter:image" content="https://left-time.app/left-icon/android-chrome-512x512.png">
    <link rel="canonical" href="https://left-time.app/web.html">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- In standalone mode, blend status bar with app background -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="color-scheme" content="light dark">
    <link rel="manifest" href="left.webmanifest">
    <link rel="apple-touch-icon" href="/left-icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/left-icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/left-icon/favicon-16x16.png">
    <link rel="stylesheet" type="text/css" href="style.css" />
    <!-- Material Symbols for Android share icon -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,1,0" />
    <!-- Roboto for Material 3 typography on this page only -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Roboto Condensed for quotes only -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      /* Material 3 color tokens (scoped to this page) */
      :root {
        --m3-primary: #6750A4;      /* strong brand accent */
        --m3-on-surface: #111110;   /* readable text */
        --m3-surface: #FFFBFE;      /* container background */
        --m3-page-bg: #F6F3FF;      /* page background tint */
      }

      /* Light mode overrides for this page only */
      @media (prefers-color-scheme: light) {
        /* Keep site light background as-is */
        /* Light mode: page background follows themed page tint */
        html, body { color: var(--m3-on-surface); background: var(--m3-page-bg); }
        .card { color: var(--m3-on-surface); }
      }

      :root {
        /* Fixed sizes: dots never change size */
        --dot-size: 8px;
        --gap: 6px; /* updated by JS; only spacing changes */
        --panel-bg: var(--m3-surface, #f7f7f4); /* card surface */
        --accent-dark: var(--m3-primary, #EEEEEC); /* unify with primary for legacy refs */
        --footer-color: inherit;
        --m3-radius: 16px; /* Material rounded corners */
        /* Shared card width cap so all cards match */
        --card-width: min(90vw, 600px);
        --actions-height: 60px; /* approx actions card total height (min) */
      }

      /* Page font and base typography */
      /* Use Roboto everywhere (Material 3 default) */
      body { font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      button, input, select, textarea { font-family: inherit; }

      /* App-specific layout (minimal; uses site styles) */
      .card {
        position: fixed;
        top: 4vh; /* small space from top */
        left: 50%;
        transform: translateX(-50%);
        width: var(--card-width);
        height: 70vh; /* 70% viewport height */
        min-width: 300px; /* enforce minimum width; grid/footer follow */
        border-radius: var(--m3-radius);
        background: var(--panel-bg);
        /* flat style, no shadows */
        box-shadow: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; /* grid vertically centered */
        padding: 2rem;
        box-sizing: border-box;
        overflow: hidden; /* keep content inside */
        z-index: 1;
      }

      .grid {
        display: grid;
        grid-auto-rows: var(--dot-size);
        gap: var(--gap); /* updated by JS */
        margin: 0; /* positioned by card */
      }

      .dot {
        width: var(--dot-size);
        height: var(--dot-size);
        border-radius: 50%;
        background: var(--m3-elements, var(--m3-primary, #111110)); /* Elements tint */
      }
      /* Glyph-based symbols */
      .dot.glyph {
        background: none;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--dot-size) + 2px);
        line-height: 1;
        color: var(--m3-elements, var(--m3-primary, #111110));
      }
      .dot.past { opacity: 0.5; }

      /* Bottom labels pinned to viewport edges (match site padding) */
      .bottom {
        position: absolute; /* inside the card */
        bottom: 1.25rem;
        left: 50%;
        transform: translateX(-50%);
        width: var(--footer-width, auto);
        display: flex;
        justify-content: space-between;
        align-items: center;
        opacity: 1; /* match full-opacity future dots */
        color: var(--m3-elements, var(--footer-color));
        font-size: 0.95em;
        font-weight: 500; /* match button weight */
        letter-spacing: 0.15px; /* align with button typography */
        pointer-events: auto; /* allow clicking/tapping labels */
        z-index: 2;
      }

      /* Respect dark mode */
      @media (prefers-color-scheme: dark) {
        html, body { color: var(--m3-on-surface) !important; background: var(--m3-page-bg) !important; }
        .card { background: var(--panel-bg, #141413); box-shadow: none; }
      }

      /* Hide native store CTA in installed PWA context */
      @media all and (display-mode: standalone) {
        #appBtn { display: none !important; }
        #quoteBtn { display: inline-flex !important; }
      }

      /* Actions card at the bottom (10% viewport height) */
      .actions-card {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 2vh;
        width: var(--card-width);
        min-width: 300px; /* match main card minimum */
        min-height: 48px; /* auto height based on content */
        border-radius: var(--m3-radius);
        background: var(--panel-bg);
        color: var(--m3-elements, currentColor);
        box-shadow: none;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px; /* tighter padding around text */
        box-sizing: border-box;
        z-index: 3;
      }
      .actions-card .actions {
        display: grid;
        grid-template-columns: 1fr auto auto; /* left icons | primary buttons | app */
        align-items: center;
        column-gap: 10px;
        width: 100%;
      }
      .actions-left { display: flex; align-items: center; gap: 12px; justify-self: start; }
      .actions-primary { display: flex; align-items: center; gap: 0; justify-self: end; }
      .actions-tail { display: flex; align-items: center; justify-self: end; }
      /* Week view rows */
      .week-row {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px 0;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: var(--m3-elements, currentColor);
      }
      .week-row.past { opacity: 0.5; }
      /* Months view grid cells */
      .month-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--m3-elements, currentColor);
      }
      .month-cell.past { opacity: 0.5; }
      .actions-right {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .color-swatch {
        display: inline-block;
        width: 2em;   /* pill width */
        height: 1em;  /* pill height */
        border-radius: 9999px; /* capsule shape */
        vertical-align: middle;
        border: 1px solid rgba(0,0,0,0.85);
        opacity: 0.9; /* match button text opacity */
      }
      #symbolPreview.symbol-circle {
        display: inline-block;
        border-radius: 50%;
        background: currentColor;
        vertical-align: middle;
      }
      .action-sep { display:none; }
      .action-btn, .action-select, .actions-card a.action-btn {
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        text-decoration: none;
        opacity: 0.9;
        display: inline-flex;
        align-items: center;
        line-height: 1; /* avoid extra vertical space */
        /* no shadows on buttons */
        box-shadow: none;
      }
      /* Icon font setup */
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        font-size: 20px;
        line-height: 1;
      }
      /* Quote view */
      .quote {
        display: none;
        max-width: 85%;
        text-align: center;
        font-family: 'Roboto Condensed', 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: clamp(34px, 6.5vw, 72px);
        line-height: 1.2;
        font-style: italic;
        color: var(--m3-elements, currentColor);
        white-space: pre-wrap;
      }
      .card.quote-mode .grid, .card.quote-mode .bottom { display: none; }
      .card.quote-mode .quote { display: block; }
      /* M3 Title/Medium for button labels */
      .actions-card .action-btn,
      .actions-card a.action-btn {
        font-weight: 500;
        font-size: 16px;
        line-height: 24px;
        letter-spacing: 0.15px;
      }
      /* Add rounded outline style to specific action buttons when NOT filled */
      #bdayConfirm:not(.btn-filled),
      #bdayBtn:not(.btn-filled),
      #appBtn:not(.btn-filled) {
        border: 0.4px solid currentColor; /* thinner outline */
        /* reduce border opacity by 20% while keeping hue */
        border-color: color-mix(in srgb, currentColor 80%, transparent);
        border-radius: 9999px;
        padding: 8px 14px;
        box-shadow: none;
      }
      /* Filled primary buttons on the right */
      .btn-filled {
        background: var(--m3-elements) !important;
        color: var(--m3-surface) !important;
        border: none !important;
        opacity: 1;
      }
      /* Ensure filled action buttons have consistent height */
      .actions-primary .action-btn.btn-filled,
      .actions-tail .action-btn.btn-filled,
      #bdayConfirm.btn-filled {
        padding: 8px 16px; /* slightly reduced height */
        min-height: 40px;
        border-radius: 9999px;
      }
      .actions-primary .material-symbols-outlined { font-size: 22px; }
      /* Segmented pill radii (inner corners smaller) */
      .btn-seg-left  { border-top-right-radius: calc(var(--m3-radius) / 2);  border-bottom-right-radius: calc(var(--m3-radius) / 2);  border-top-left-radius: var(--m3-radius); border-bottom-left-radius: var(--m3-radius); }
      .btn-seg-right { border-top-left-radius: calc(var(--m3-radius) / 2);  border-bottom-left-radius: calc(var(--m3-radius) / 2);  border-top-right-radius: var(--m3-radius); border-bottom-right-radius: var(--m3-radius); }
      .btn-standalone { border-radius: var(--m3-radius); }
      /* Left icon buttons: compact, no outline */
      #viewBtn, #symbolBtn, #colorBtn, #personBtn {
        border: none;
        padding: 8px 10px;
        border-radius: 9999px;
      }
      /* Symbol preview uses Material Symbols in the picker */
      #symbolPreview .material-symbols-outlined {
        font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        font-size: 20px;
        line-height: 1;
      }
      /* Exclude symbol and color pickers from outlined style */
      #symbolBtn,
      #colorBtn,
      #personBtn { border: none; padding: 6px; }
      /* Share button styled like left-side icons but stays right-aligned */
      #shareBtn, #quoteBtn { border: none; padding: 6px; background: transparent; }
      #shareBtn .material-symbols-outlined,
      #quoteBtn .material-symbols-outlined { font-size: 22px; }
      /* Hide quote button by default; show only when installed */
      #quoteBtn { display: none; }
      /* Make the view button larger (about 2x icon size) */
      #viewBtn { padding: 6px; }
      #viewBtn .material-symbols-outlined { font-size: 30px; }
      #personBtn { padding: 6px; }
      #personBtn .material-symbols-outlined { font-size: 25px; }
      /* Constrain symbol preview box to prevent overflow on mobile */
      #symbolPreview {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.1em;
        height: 1.1em;
        line-height: 1;
        overflow: hidden; /* clamp oversized glyphs */
      }
      /* Override global link gradient styles inside the actions card */
      .actions-card a.action-btn:not(.btn-filled),
      .actions-card a.action-btn:visited:not(.btn-filled) {
        color: inherit !important;
        background: none !important;
        -webkit-background-clip: initial !important;
        -webkit-text-fill-color: currentColor !important;
        text-decoration: none;
      }
      .actions-card a.action-btn.btn-filled {
        color: var(--m3-surface) !important;
        background: var(--m3-elements) !important;
      }
      .actions-card a.action-btn:hover { text-decoration: none; }
      .bday-panel {
        position: fixed; /* match exact width with cards */
        left: 50%;
        transform: translateX(-50%);
        width: var(--card-width);
        min-width: 300px;
        bottom: calc(2vh + var(--actions-height) + 2px); /* tiny visual gap */
        z-index: 4; /* ensure it appears above the actions card */
        display: none;
        gap: 8px;
        align-items: flex-start;
        flex-direction: column;
        background: var(--panel-bg);
        color: var(--m3-elements, currentColor);
        border-radius: var(--m3-radius); /* match actions-card/card radius */
        box-shadow: none;
        padding: 12px 16px;
        box-sizing: border-box;
      }
      /* Align Calculate button to the right inside the row */
      #bdayConfirm { margin-left: auto; }
      .bday-label { font-size: 0.9em; opacity: 0.8; width: 100%; text-align: center; }
      .bday-row { display: flex; align-items: center; gap: 8px; width: 100%; }
      @media (prefers-color-scheme: dark) {
        .actions-card, .bday-panel {
          background: var(--panel-bg, #141413);
          box-shadow: none;
          color: var(--m3-elements, var(--m3-on-surface, #EEEEEC));
        }
        .actions-card a.action-btn,
        .actions-card a.action-btn:hover,
        .actions-card a.action-btn:visited {
          color: var(--m3-elements, var(--m3-on-surface, inherit)) !important;
          background: none !important;
          -webkit-background-clip: initial !important;
          -webkit-text-fill-color: currentColor !important;
        }
        /* no shadows on buttons in dark mode */
        .action-btn { box-shadow: none; }
        #bdayConfirm:not(.btn-filled),
        #bdayBtn:not(.btn-filled),
        #shareBtn:not(.btn-filled),
        #appBtn:not(.btn-filled) {
          /* thinner + 20% less opaque, synced with font color */
          border-color: color-mix(in srgb, currentColor 80%, transparent);
          box-shadow: none;
      }
        .color-swatch { border-color: rgba(255,255,255,0.35); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="grid" class="grid" aria-label="Days of the year"></div>
      <div id="quote" class="quote" aria-live="polite"></div>
      <div class="bottom">
        <span id="year"></span>
        <span id="right-info" aria-live="polite"></span>
      </div>
    </div>
    <div class="actions-card">
      <div class="actions">
        <div class="actions-left">
          <button id="viewBtn" class="action-btn" aria-label="Change view"><span class="material-symbols-outlined" aria-hidden="true">view_carousel</span></button>
          <button id="symbolBtn" class="action-btn" aria-label="Change symbol"><span id="symbolPreview"></span></button>
          <button id="colorBtn" class="action-btn" aria-label="Change color"><span class="material-symbols-outlined" aria-hidden="true">palette</span></button>
          <button id="personBtn" class="action-btn" aria-label="Set your birthday"><span class="material-symbols-outlined" aria-hidden="true">person_edit</span></button>
        </div>
        <div class="actions-primary">
          <button id="quoteBtn" aria-label="Show a quote" class="action-btn"><span class="material-symbols-outlined" aria-hidden="true">format_quote</span></button>
          <button id="shareBtn" aria-label="Share snapshot" class="action-btn"><span class="material-symbols-outlined" aria-hidden="true">share</span></button>
        </div>
        <div class="actions-tail">
          <button id="appBtn" class="action-btn btn-filled btn-standalone">Get the app</button>
        </div>
      </div>
      <div id="bdayPanel" class="bday-panel">
        <div class="bday-label">When were you born?</div>
        <div class="bday-row">
          <select id="bdayMonth" class="action-select"></select>
          <select id="bdayYear" class="action-select"></select>
          <button id="bdayConfirm" class="action-btn btn-filled">Calculate</button>
        </div>
      </div>
    </div>

    <!-- html2canvas for snapshotting the card -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script>
      // Register service worker for PWA capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err){
            console.debug('SW registration failed', err);
          });
        });
      }

      // Notifications: prompt when installed and optionally schedule a daily reminder
      (function notificationsSetup(){
        const LS_OPT_IN = 'left_notify_opt_in';
        const LS_PROMPTED = 'left_notify_prompted';
        const LS_LAST_SENT = 'left_notify_last_sent'; // yyyy-mm-dd local
        const LS_SCHEDULED_UNTIL = 'left_notify_scheduled_until'; // yyyy-mm-dd local

        function dayOfYear(d){
          const start = new Date(d.getFullYear(),0,1); // local midnight Jan 1
          const ms = d - start;
          return Math.floor(ms / 86400000);
        }
        function daysLeftInYearFor(d){
          const yearStart = new Date(d.getFullYear(), 0, 1);
          const nextStart = new Date(d.getFullYear()+1, 0, 1);
          const total = Math.round((nextStart - yearStart) / 86400000);
          const todayIndex = Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - yearStart)/86400000);
          return Math.max(0, total - (todayIndex + 1));
        }
        function nextNineAMEpoch(){
          const now = new Date();
          const next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 9, 0, 0, 0);
          if (now.getTime() >= next.getTime()) {
            next.setDate(next.getDate() + 1);
          }
          return next.getTime();
        }
        function nineAMOf(d){
          const t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 9, 0, 0, 0);
          return t.getTime();
        }
        function todaysKey(){
          const n = new Date();
          const mm = String(n.getMonth()+1).padStart(2,'0');
          const dd = String(n.getDate()).padStart(2,'0');
          return `${n.getFullYear()}-${mm}-${dd}`;
        }
        const messages = [
          'Only {days} days left this year. Make them count.',
          '{days} days remain. Do one small thing that matters.',
          '{days} days to go. Spend them on what you value.',
          'Tick tock: {days} days left this year.',
          'You have {days} more chances this year.',
          '{days} days left. Choose intentionally.',
          'Make today count. {days} days left this year.',
          '{days} days remain. Take a step forward today.',
          'Focus on what matters. {days} days left.',
          '{days} days left. Tiny steps add up.'
        ];
        function messageForDate(d){
          const idx = dayOfYear(d) % messages.length;
          return messages[idx].replace('{days}', String(daysLeftInYearFor(d)));
        }
        async function sendNotificationNow(reg){
          try {
            const title = 'Left';
            const body = messageForDate(new Date());
            const options = {
              body,
              tag: 'left-daily',
              renotify: false,
              icon: '/left-icon/android-chrome-192x192.png',
              badge: '/left-icon/android-chrome-192x192.png'
            };
            if (reg && reg.showNotification) {
              await reg.showNotification(title, options);
            } else if (Notification && Notification.permission === 'granted') {
              new Notification(title, options);
            }
            try { localStorage.setItem(LS_LAST_SENT, todaysKey()); } catch(_) {}
          } catch(_) {}
        }
        function parseKey(k){
          const [y,m,d] = (k||'').split('-').map(v => parseInt(v,10));
          if (!y || !m || !d) return null;
          return new Date(y, m-1, d);
        }
        function addDays(d, n){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
        function keyForDate(d){
          const mm = String(d.getMonth()+1).padStart(2,'0');
          const dd = String(d.getDate()).padStart(2,'0');
          return `${d.getFullYear()}-${mm}-${dd}`;
        }
        async function scheduleUpcoming(reg, count = 20){
          try {
            // Prefer Notification Triggers (Chrome-based, experimental)
            if ('TimestampTrigger' in window && reg && reg.showNotification) {
              const now = new Date();
              const today9 = nineAMOf(now);
              const startDate = (Date.now() < today9) ? new Date(now.getFullYear(), now.getMonth(), now.getDate()) : addDays(now, 1);

              const scheduledUntilKey = (function(){ try { return localStorage.getItem(LS_SCHEDULED_UNTIL)||''; } catch(_) { return ''; } })();
              const scheduledUntil = parseKey(scheduledUntilKey);

              let targetUntil = addDays(startDate, count - 1);
              // If we already scheduled into the future, only top up beyond that
              let fromDate = startDate;
              if (scheduledUntil && scheduledUntil.getTime() >= startDate.getTime()) {
                fromDate = addDays(scheduledUntil, 1);
                const daysAhead = Math.ceil((addDays(startDate, count - 1) - startDate)/86400000);
                targetUntil = addDays(scheduledUntil, Math.max(0, daysAhead));
              }

              for (let d = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate()); d.getTime() <= targetUntil.getTime(); d.setDate(d.getDate() + 1)) {
                const when = nineAMOf(d);
                // Skip if time somehow in the past
                if (when <= Date.now()) continue;
                const tag = `left-daily-${keyForDate(d)}`;
                const opts = {
                  tag,
                  showTrigger: new window.TimestampTrigger(when),
                  body: messageForDate(new Date(d.getFullYear(), d.getMonth(), d.getDate())),
                  icon: '/left-icon/android-chrome-192x192.png',
                  badge: '/left-icon/android-chrome-192x192.png',
                  data: { date: keyForDate(d) }
                };
                await reg.showNotification('Left', opts);
              }
              try { localStorage.setItem(LS_SCHEDULED_UNTIL, keyForDate(targetUntil)); } catch(_) {}
            } else {
              // Fallback: best-effort timer while app is open
              const ts = nextNineAMEpoch();
              const delay = Math.max(0, ts - Date.now());
              setTimeout(() => { sendNotificationNow(reg); scheduleUpcoming(reg, count); }, delay);
            }
          } catch(_) {}
        }
        async function enableDaily(){
          try { localStorage.setItem(LS_OPT_IN, '1'); } catch(_) {}

          const toHex = (x) => x.toString(16).padStart(2, '0');

        // Helper to parse saved birthdate (YYYY-MM)
        function getSavedBirthDate() {
          try {

            : ['year','months','month','week','day'];
          const curIndex = Math.max(0, cycle.indexOf(mode));
          const nextIndex = (curIndex + 1) % cycle.length;
          const nextMode = cycle[nextIndex];
          mode = nextMode;
          if (mode === 'life') { state = lifeState(savedBirth); }
          else if (mode === 'year') { state = yearState(); }
          else if (mode === 'months') { state = monthsState(); }
          else if (mode === 'month') { state = monthState(); }

        // Birthday flow → Life mode (7x12 = 84 years)
        function lifeState(birth) {
          const birthDate = new Date(birth.getFullYear(), birth.getMonth(), birth.getDate());
          const birthYear = birthDate.getFullYear();
          const targetLifespan = 84; // years
          // Completed years
          const today = new Date();
          let yearsCompleted = today.getFullYear() - birthYear;
          // Adjust if before birthday this year
          const hadBirthday = (today.getMonth() > birth.getMonth()) || (today.getMonth() === birth.getMonth() && today.getDate() >= birth.getDate());
          if (!hadBirthday) yearsCompleted -= 1;
          yearsCompleted = Math.max(0, Math.min(targetLifespan, yearsCompleted));
          const yearsLeft = Math.max(0, targetLifespan - yearsCompleted);

          return {
            kind: 'life',
            labelLeft: 'My life',
            totalDays: targetLifespan,
            todayIndex: yearsCompleted - 1, // mark completed years as past
            cols: 7,
            rows: 12,
            daysLeft: yearsLeft,
            birthYear
          };
        }

        function startLifeModeWith(input) {
          try {
            const d = input instanceof Date ? input : new Date(input);

            mode = 'life';
            state = lifeState(d);
            // Persist
            try {
              const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; // YYYY-MM
              localStorage.setItem('left_birthdate', key);

        // Compute gap so the grid uses 90% of card height, never resizing dots
        function recalcGap() {
          const sample = grid.querySelector('.dot');
          if (!sample) return;
          const dotPx = sample.getBoundingClientRect().width || 8;

          const cols = state.cols, rows = state.rows;
          const card = document.querySelector('.card');
          const cs = getComputedStyle(card);
          const paddingX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
          const paddingY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
          const cardInnerW = Math.max(0, card.clientWidth - paddingX);
          const cardInnerH = Math.max(0, card.clientHeight - paddingY);

          const compute = (cCols, cRows, availW) => {
            const targetH = cardInnerH * 0.9;
            const gapH = (targetH - cRows * dotPx) / (cRows - 1 || 1);
            const gapW = (availW - cCols * dotPx) / (cCols - 1 || 1);
            const gap = Math.max(0, Math.min(gapW, gapH));
            const width = cCols * dotPx + (cCols - 1) * gap;
            return { gap, width };
          };

          // Compute how wide the YEAR grid would be in this viewport
          const yearMetrics = compute(15, 25, cardInnerW);

          // Cap grid width to the YEAR grid width for all views
          const allowedW = Math.min(cardInnerW, yearMetrics.width);

          const current = compute(cols, rows, allowedW);
          grid.style.gap = current.gap + 'px';
          grid.style.width = current.width + 'px';
          document.documentElement.style.setProperty('--footer-width', current.width + 'px');
        }

              row.style.fontWeight = '800';
              row.style.letterSpacing = '0.02em';
              row.style.fontSize = '72px';
              row.style.lineHeight = '1';
              row.style.color = primary;
              row.style.opacity = (i < state.todayIndex) ? '0.5' : '1';
              row.textContent = days[i];
              exportGrid.appendChild(row);
            }
          } else if (state.kind === 'months') {
            for (let i = 0; i < 12; i++) {
              const cell = document.createElement('div');
              cell.style.display = 'flex';
              cell.style.alignItems = 'center';
              cell.style.justifyContent = 'center';
              cell.style.fontWeight = '800';
              cell.style.letterSpacing = '0.02em';
              cell.style.fontSize = '72px';
              cell.style.lineHeight = '1';
              cell.style.color = primary;
              cell.style.opacity = (i < state.todayIndex) ? '0.5' : '1';
              cell.textContent = monthsShort[i].toUpperCase();
              exportGrid.appendChild(cell);
            }
          } else {
            for (let i = 0; i < state.totalDays; i++) {
              const isPast = i <= state.todayIndex;
              if (useGlyph) {
                const cell = document.createElement('div');
                cell.style.width = EXPORT_DOT + 'px';
                cell.style.height = EXPORT_DOT + 'px';
                cell.style.display = 'flex';
                cell.style.alignItems = 'center';
                cell.style.justifyContent = 'center';
                // Make shapes larger in export; triangle/star slightly bigger than default
                const exportedSymbolIndex = (function(){ try { return (localStorage.getItem('left_symbol_index')|0); } catch(_) { return 0; }})();
                const baseSize = EXPORT_DOT + 2;
                const fontSize = (exportedSymbolIndex === 1 || exportedSymbolIndex === 4)
                  ? baseSize * 2                        // 1=square, 4=hexagon
                  : (exportedSymbolIndex === 2 || exportedSymbolIndex === 3)
                    ? Math.round(baseSize * 1.6)       // 2=triangle, 3=star
                    : baseSize;                         // dot
                cell.style.fontSize = fontSize + 'px';
                cell.style.lineHeight = '1';
                cell.style.color = primary;
                cell.style.opacity = isPast ? '0.5' : '1';
                cell.textContent = symChar || '•';
                exportGrid.appendChild(cell);
              } else {
                const dot = document.createElement('div');
                dot.style.width = EXPORT_DOT + 'px';
                dot.style.height = EXPORT_DOT + 'px';
                dot.style.borderRadius = '50%';
                dot.style.background = primary;
                dot.style.opacity = isPast ? '0.5' : '1';
                exportGrid.appendChild(dot);
              }
            }
          }

          // Footer color uses same tint as elements
          exportFooter.style.color = primary;

          exportCard.appendChild(exportGrid);
          exportCard.appendChild(exportFooter);
          exportRoot.appendChild(exportCard);

          // Add bottom-centered site label outside the card
          const cardSide = Math.round((OUTER - CARD) / 2);
          const exportLabelRight = document.createElement('div');
          exportLabelRight.textContent = 'left-time.app';
          exportLabelRight.style.position = 'absolute';
          // Align label with the card's right edge
          exportLabelRight.style.right = cardSide + 'px';
          exportLabelRight.style.textAlign = 'right';
          exportLabelRight.style.bottom = '40px';
          exportLabelRight.style.fontFamily = getComputedStyle(document.body).fontFamily;
          exportLabelRight.style.fontSize = '40px';
          exportLabelRight.style.fontWeight = '500';
          exportLabelRight.style.letterSpacing = '0.15px';
          exportLabelRight.style.color = primary; // match footer color
          exportLabelRight.style.opacity = '1';
          exportRoot.appendChild(exportLabelRight);

          // Add bottom-left label aligned with the card's left edge
          const exportLabelLeft = document.createElement('div');
          exportLabelLeft.textContent = 'Visualize your time left';
          exportLabelLeft.style.position = 'absolute';
          exportLabelLeft.style.left = cardSide + 'px';
          exportLabelLeft.style.textAlign = 'left';
          exportLabelLeft.style.bottom = '40px';
          exportLabelLeft.style.fontFamily = getComputedStyle(document.body).fontFamily;
          exportLabelLeft.style.fontSize = '40px';
          exportLabelLeft.style.fontWeight = '500';
          exportLabelLeft.style.letterSpacing = '0.15px';
          exportLabelLeft.style.color = primary; // match footer color
          exportLabelLeft.style.opacity = '1';
          exportRoot.appendChild(exportLabelLeft);
          document.body.appendChild(exportRoot);

          // Compute spacing inside export card to center-top grid and align footer width
          (function calcExportLayout(){
            const dotPx = EXPORT_DOT; // fixed for export
            const padding = 120 * 2; // left+right and top+bottom equal
            const innerW = CARD - padding;
            const innerH = CARD - padding;

            const compute = (cols, rows, availW) => {
              const targetH = innerH * 0.9;
              const gapH = (targetH - rows * dotPx) / (rows - 1 || 1);
              const gapW = (availW - cols * dotPx) / (cols - 1 || 1);
              const gap = Math.max(0, Math.min(gapW, gapH));
              const gridW = cols * dotPx + (cols - 1) * gap;
              return { gap, gridW };
            };

            // Base: compute how wide the YEAR grid would be in this export card
            const yearBase = compute(15, 25, innerW);

            // Current grid (month or year) is capped to the year width
            const cols = (state.kind === 'week') ? 1 : (state.kind === 'months' ? 3 : state.cols);
            const rows = (state.kind === 'week') ? 7 : (state.kind === 'months' ? 4 : state.rows);
            const capped = compute(cols, rows, Math.min(innerW, yearBase.gridW));

            if (state.kind === 'week' || state.kind === 'months') {
              // Give the week list a fixed vertical space to avoid footer overlap
              const gridW = Math.min(innerW, yearBase.gridW);
              exportGrid.style.width = gridW + 'px';
              // Let height auto so vertical centering works
              exportGrid.style.height = 'auto';
            } else {
              exportGrid.style.gap = capped.gap + 'px';
              exportGrid.style.width = capped.gridW + 'px';
            }

            // Footer matches grid width and is centered horizontally
            const widthForFooter = (state.kind === 'week' || state.kind === 'months') ? Math.min(innerW, yearBase.gridW) : capped.gridW;
            exportFooter.style.width = widthForFooter + 'px';
            const left = Math.round((CARD - widthForFooter) / 2);
            exportFooter.style.left = left + 'px';
          })();

          const canvas = await window.html2canvas(exportRoot, {
            backgroundColor: siteBg,
            scale: 1,
            width: OUTER,
            height: OUTER
          });

          // Cleanup the offscreen DOM
          exportRoot.remove();

          canvas.toBlob(async (blob) => {
            if (!blob) return;
            const modeLabel = yearEl.textContent.trim();
            const filename = `left-${modeLabel.replace(/\s+/g,'-').toLowerCase()}.png`;

            // Attempt native share with files; avoid downloading if user cancels
            let shared = false;
            try {
              const file = new File([blob], filename, { type: 'image/png' });
              const shareData = { files: [file], title: 'Left', text: 'My time left! Check yours on https://left-time.app' };
              if ((navigator.canShare && navigator.canShare(shareData)) || (navigator.share && !('canShare' in navigator))) {
                await navigator.share(shareData);
                shared = true;
              }
            } catch (err) {
              if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return; // user dismissed
            }
            if (shared) return;

            // Fallback: download the image
            const a = document.createElement('a');
            a.download = filename;
            a.href = URL.createObjectURL(blob);
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(a.href);
            a.remove();
          }, 'image/png');
        }
        shareBtn.addEventListener('click', shareSnapshot);
      })();
    </script>
  </body>
  </html>
